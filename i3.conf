# miscree i3 integration, included straight from this repo by `bin/miscree setup`.
# Uses $mod from your i3 config and $miscree (this repo's bin/miscree), set just before the include.

exec --no-startup-id $miscree startup

bindsym $mod+semicolon exec --no-startup-id $miscree on laptop
bindsym $mod+Shift+semicolon exec --no-startup-id $miscree off laptop
bindsym $mod+k exec --no-startup-id $miscree on external
bindsym $mod+Shift+k exec --no-startup-id $miscree off external
