# miscree i3 integration. Installed once to ~/.config/miscree/i3.conf and
# included from your i3 config; edits are kept. Uses $mod from your i3 config.

exec_always --no-startup-id @BIN@ watch

bindsym $mod+semicolon exec --no-startup-id @BIN@ on laptop
bindsym $mod+Shift+semicolon exec --no-startup-id @BIN@ off laptop
bindsym $mod+k exec --no-startup-id @BIN@ on external
bindsym $mod+Shift+k exec --no-startup-id @BIN@ off external
