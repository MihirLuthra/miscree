; miscree config. Created once at ~/.config/miscree/config.ini by `miscree setup`; edits are kept.
; `miscree list` shows each screen's kind, model name and resulting zoom.
; Changes apply at the next switch (press a shortcut, or re-plug).

[general]
; Scale every app renders at (1, 2 or 3). 2 keeps zoomed text sharp.
; Changing it needs a log out and back in.
render_scale = 2
; How the second screen fits the first when mirroring: letterbox | stretch
mirror_fit = letterbox
; External screens at least this big (diagonal inches) count as a TV.
tv_min_inches = 40

[zoom]
; Per kind of screen. Bigger = bigger everything. Accepted values:
;   130dpi   the size you'd get from `Xft.dpi: 130`
;   1.35     a plain zoom factor (1 = 96 dpi)
;   auto     pick from the screen's physical size (see [auto])
laptop = 130dpi
monitor = 100dpi
tv = auto

[auto]
; laptop / monitor: zoom = physical DPI / target DPI   (lower target = bigger)
laptop_target_dpi = 108
monitor_target_dpi = 110
; TVs (and screens that don't report a size) become this many pixels tall.
tv_logical_height = 1080
; Auto zoom is rounded to this step and never goes below 1.
step = 0.25

[models]
; Per-monitor overrides, by the MODEL name shown in `miscree list`. Same values as [zoom].
; DELL U2723QE = 120dpi
; SAMSUNG = 2
